{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h2 class="mb-4 text-center">
                Register
            </h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Register
                </button>

                <h6 class="text-center mt-4">
                    <a href="{{ url_for('main.login') }}">Already have a account?</a>
                </h6>

            </form>

        </div>

    </div>

</div>

{% endblock %}
